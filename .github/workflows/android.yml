name: iAgent Android

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iagent-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0 cmake;3.22.1 ndk;28.2.13676358

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Run unit tests
        run: ./gradlew :app:testGithubDebugUnitTest :mediagen:testDebugUnitTest --console=plain

      - name: Build signed APKs
        env:
          IAGENT_SIGNING_KEY_BASE64: ${{ secrets.IAGENT_SIGNING_KEY_BASE64 }}
          IAGENT_SIGNING_PASSWORD: ${{ secrets.IAGENT_SIGNING_PASSWORD }}
        run: |
          if [ -z "$IAGENT_SIGNING_KEY_BASE64" ] || [ -z "$IAGENT_SIGNING_PASSWORD" ]; then
            echo "::error::Set IAGENT_SIGNING_KEY_BASE64 and IAGENT_SIGNING_PASSWORD for Android signing."
            exit 1
          fi
          umask 077
          export IAGENT_SIGNING_STORE_FILE="$(mktemp "$RUNNER_TEMP/iagent-signing.XXXXXX")"
          trap 'rm -f "$IAGENT_SIGNING_STORE_FILE"' EXIT
          printf '%s' "$IAGENT_SIGNING_KEY_BASE64" | base64 --decode > "$IAGENT_SIGNING_STORE_FILE"
          unset IAGENT_SIGNING_KEY_BASE64
          ./gradlew :app:assembleGithubRelease -PiagentSplitOnly --no-configuration-cache --console=plain

      - name: Verify and collect APKs
        run: |
          apk_dir=app/build/outputs/apk/github/release
          version="$(jq -er '.elements[0].versionName' "$apk_dir/output-metadata.json")"
          mkdir -p dist/apks
          for abi in arm64-v8a x86_64; do
            filename="$(jq -er --arg abi "$abi" '.elements[] | select(any(.filters[]; .value == $abi)) | .outputFile' "$apk_dir/output-metadata.json")"
            apk="$apk_dir/$filename"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
            cp "$apk" "dist/apks/iAgent-$version-$abi.apk"
          done
          cd dist/apks
          sha256sum ./*.apk > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: iAgent-Android-APKs
          path: dist/apks/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
